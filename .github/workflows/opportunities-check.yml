name: opportunities-check

# Checks pull requests that touch the opportunities list: programs.json must be
# valid, have no duplicates, and new links must load. README.md is generated
# from programs.json, so hand edits to it are turned away.
on:
  pull_request:
    paths:
      - opportunities/**
      - README.md

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README.md isn't edited by hand
        run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qx README.md; then
            echo "::error::README.md is generated from opportunities/programs.json. Edit programs.json instead (or use the 'Suggest a program' issue form)."
            exit 1
          fi
      - name: programs.json is valid
        run: |
          git show "origin/$GITHUB_BASE_REF:opportunities/programs.json" > base.json
          python opportunities/programs.py check --base base.json
