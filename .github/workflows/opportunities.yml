name: opportunities

# Daily, re-render the opportunities board (README.md) from
# opportunities/programs.json so "Coming up" follows the calendar.
# Commits only when the board actually changes. See opportunities/board.py.
on:
  schedule:
    - cron: "0 14 * * *"   # 6-7 AM Pacific
  workflow_dispatch:
  push:
    paths:
      - opportunities/**

permissions:
  contents: write

concurrency:
  group: opportunities
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render the board
        run: python opportunities/board.py
      - name: Commit README.md (only if it changed)
        run: |
          if git diff --quiet README.md; then
            echo "Board unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update opportunities board [skip ci]"
            git pull --rebase
            git push
          fi
